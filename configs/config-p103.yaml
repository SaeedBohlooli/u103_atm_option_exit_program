ws_port: 6103

api_service:
  host: 127.0.0.1
  port: 5103

interval_seconds:
  engine_loop: 2
  state_streamer: 15
  config_streamer: 60

dirs:
  default: "../../portfolios/{portfolio_id}/default"
  results: "../../portfolios/{portfolio_id}/results"
  ib: "../../portfolios/{portfolio_id}/ib"
  reports: "../../portfolios/{portfolio_id}/reports"
  log_dir: "../../portfolios/{portfolio_id}/logs/{date}"
  intermediate: "../../portfolios/{portfolio_id}/intermediate"
  ohlc: "../../portfolios/{portfolio_id}/backtest-ohlc"
  ohlc_archive: "../../portfolios/{portfolio_id}/ohlc-archive"
  ohlc_w_indicators: "../../portfolios/{portfolio_id}/ohlc-w-indicators"
  charts: "../../portfolios/{portfolio_id}/charts"


  # -------- DataFrames --------

files:
  application_state: "{intermediate}/application_state.json"



order_setup:
  conditions:
    cond_1:
      - last_x_diffs_total > atm_trigger # a
      - current_price < user_input_entry_spx_price - user_input_spx_price_trigger
    cond_2:
      - day_highest_atm_strike > user_input_base_atm_price + base_atm_trigger  # F > e + c
      - current_price < user_input_entry_spx_price - user_input_spx_price_trigger
  master_condition: cond_1 or cond_2



symbol: SPXW

run_should_take_seconds: 5

run_condition_checker: true
close_condition: (base_atm_straddle * multiplier < call_ask + put_ask)  and 930  < current_hh_mm_ny < 1559
#close_condition: 1 == 1


# This is only for test purpose. Don't use it
open_position: false
cancel_open_orders_before_send_order: true
